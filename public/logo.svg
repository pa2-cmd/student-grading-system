<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <!-- Shadow for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Rounded Shield/Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Outer Ring Accent -->
  <rect x="10" y="10" width="80" height="80" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- Graduation Cap & Checklist Concept -->
  <g transform="translate(18, 18) scale(0.64)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Graduation Cap Roof (Diamond) -->
    <path d="M50 15 L88 35 L50 55 L12 35 Z" fill="#FFFFFF" fill-opacity="0.1" stroke-width="5" />
    
    <!-- Tassel -->
    <path d="M88 35 V60 C88 65, 83 70, 78 70" stroke-width="4" stroke-dasharray="1 1" />
    <circle cx="78" cy="70" r="3" fill="#FFFFFF" />

    <!-- Cap Base -->
    <path d="M28 47 V65 C28 73, 72 73, 72 65 V47" stroke-width="5" fill="#FFFFFF" fill-opacity="0.05" />

    <!-- Checklist / A+ Symbol Accent inside the cap (subtle checkmark at bottom) -->
    <path d="M42 63 L48 69 L60 57" stroke-width="5" stroke-opacity="0.9" />
  </g>
  
  <!-- A+ Badge Overlay -->
  <g transform="translate(56, 56)">
    <!-- Small badge background -->
    <circle cx="20" cy="20" r="16" fill="#1E293B" filter="url(#dropShadow)" />
    <circle cx="20" cy="20" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />
    <!-- A+ text -->
    <text x="14" y="25" font-family="'Inter', sans-serif, system-ui" font-size="15" font-weight="900" fill="#22C55E">A</text>
    <text x="23" y="22" font-family="'Inter', sans-serif, system-ui" font-size="10" font-weight="900" fill="#22C55E">+</text>
  </g>
</svg>
